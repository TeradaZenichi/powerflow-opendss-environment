[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powerflow-opendss-environment"
version = "0.1.0"
description = "Gymnasium environment backed by OpenDSS"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.4,<3",
    "OpenDSSDirect.py>=0.9,<1",
    "pandas>=3,<4",
]

[tool.setuptools.packages.find]
include = ["opendss_env*"]
